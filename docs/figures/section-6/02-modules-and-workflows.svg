<text x="60" y="932" fill="#53667D" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start">The same runtime interface applies to all module roles. Numerical connections are defined by each workflow.</text>
<text x="60" y="960" fill="#53667D" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start">Prototype: sequential final-output handoff with placeholder models. Further coupling patterns require implementation and validation.</text>
