<text x="60" y="1032" fill="#53667D" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start">Proposed batch-oriented contract: preserve site scope, input-batch ID, run ID, model/workflow versions and timestamps.</text>
<text x="60" y="1060" fill="#53667D" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start">The current runner cannot keep a connector FMU alive between steps. A background FMU needs additional coordination.</text>
