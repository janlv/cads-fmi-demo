<text x="800" y="968.0" fill="#A96B11" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="middle">Deployment choice remains open: workflow adapter, service, or FMU with explicit runtime lifecycle support.</text>
